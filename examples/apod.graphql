# Open http://localhost:2259/graphiql and select one operation to run.
# `pictures` returns today with no selector, one historical picture with `date`,
# or a list of matching pictures with `search`.

query Today {
  pictures { astronomy { ...PictureFields } }
}

query ByDate {
  pictures { astronomy(date: "2024-02-29") {
    ...PictureFields
    similar(limit: 5) {
      ...SearchPictureFields
      relevanceScore
    }
  } }
}

query Search {
  pictures { astronomy(search: "spiral galaxy", limit: 5) {
    ...PictureFields
    relevanceScore
    matchTypes
  } }
}

query EarthObservatory {
  pictures { earthObservatory(date: "2026-09-11") { date title url articleUrl } }
}

fragment PictureFields on Picture {
  date
  title
  explanation
  mediaType
  url
  credit
  copyright
}

fragment SearchPictureFields on SearchPicture {
  date
  title
  explanation
  mediaType
  url
  credit
  copyright
  relevanceScore
  matchTypes
}
