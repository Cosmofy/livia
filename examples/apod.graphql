# Open http://localhost:2259/graphiql and select one operation to run.
# `pictures` returns today with no selector, one historical picture with `date`,
# or a list of matching pictures with `search`.

query Today {
  pictures { ...PictureFields }
}

query ByDate {
  pictures(date: "2024-02-29") {
    ...PictureFields
    similar(limit: 5) {
      ...SearchPictureFields
      relevanceScore
    }
  }
}

query Search {
  pictures(search: "spiral galaxy", limit: 5) {
    ...PictureFields
    relevanceScore
    matchTypes
  }
}

fragment PictureFields on Picture {
  date
  title
  explanation
  mediaType
  url
  credit
  copyright
}

fragment SearchPictureFields on SearchPicture {
  date
  title
  explanation
  mediaType
  url
  credit
  copyright
  relevanceScore
  matchTypes
}
