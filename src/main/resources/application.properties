spring.application.name=livia
server.port=2259
dgs.graphql.virtualthreads.enabled=true
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}
logging.level.xyz.arryan.livia=DEBUG
logging.level.graphql.request=INFO
server.forward-headers-strategy=framework

# Internal APOD microservice. The production URL is non-secret and may be overridden per deployment.
apod.client.base-url=${APOD_SERVICE_BASE_URL:https://apod.api.cosmofy.services.deployim.com}
apod.client.connect-timeout=${APOD_CONNECT_TIMEOUT:3s}
apod.client.apod-request-timeout=${APOD_REQUEST_TIMEOUT:35s}
apod.client.search-request-timeout=${APOD_SEARCH_REQUEST_TIMEOUT:15s}
apod.client.max-attempts=${APOD_MAX_ATTEMPTS:2}
apod.client.retry-backoff=${APOD_RETRY_BACKOFF:200ms}

# AWS Configuration
aws.region=us-east-1

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://phantom:dancer@slasher.lhwpaku.mongodb.net/cosmofy
spring.data.mongodb.database=cosmofy
