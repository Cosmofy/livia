name: deploy-oracle-london

on:
  workflow_run:
    workflows: [build]
    types: [completed]

concurrency:
  group: livia-production-oracle-london
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Download tested release
        uses: actions/download-artifact@v8
        with:
          name: livia-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to Oracle London
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          test -s release/build/libs/livia-0.0.1-SNAPSHOT.jar
          test -s release/build/otel/opentelemetry-javaagent.jar
          test -s release/deploy/otel-collector.yaml
          test -s release/deploy/cosmofy-livia-otel.service
          test -s release/deploy/livia.service

          remote_release="/tmp/livia-release-${DEPLOY_SHA}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ubuntu@oracle \
            "install -d -m 0700 '${remote_release}'"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            release/build/libs/livia-0.0.1-SNAPSHOT.jar \
            ubuntu@oracle:"${remote_release}/livia.jar"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            release/build/otel/opentelemetry-javaagent.jar \
            ubuntu@oracle:"${remote_release}/opentelemetry-javaagent.jar"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            release/deploy/otel-collector.yaml \
            release/deploy/cosmofy-livia-otel.service \
            release/deploy/livia.service \
            ubuntu@oracle:"${remote_release}/"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ubuntu@oracle \
            "DEPLOY_SHA=${DEPLOY_SHA} REMOTE_RELEASE=${remote_release} bash -s" << 'EOF'
            set -euo pipefail
            collector_version=0.160.0
            collector_sha256=cbede80242043eda399006cbfde314ae0e78e949362127ce9d573769b2792fe0
            collector_url="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${collector_version}/otelcol-contrib_${collector_version}_linux_arm64.deb"

            if ! command -v otelcol-contrib >/dev/null 2>&1 || \
               ! otelcol-contrib --version 2>&1 | grep -q "version ${collector_version}"; then
              collector_deb=$(mktemp --suffix=.deb)
              curl --fail --silent --show-error --location "$collector_url" --output "$collector_deb"
              echo "${collector_sha256}  ${collector_deb}" | sha256sum --check --status
              sudo dpkg --install "$collector_deb"
              rm -f "$collector_deb"
              sudo systemctl disable --now otelcol-contrib.service 2>/dev/null || true
            fi

            cd /home/ubuntu/livia-oracle
            git fetch origin main
            test "$(git rev-parse origin/main)" = "${DEPLOY_SHA}"
            git merge --ff-only "${DEPLOY_SHA}"

            sudo install -d -o root -g root -m 0755 /opt/cosmofy/livia/releases
            sudo install -d -o root -g root -m 0755 "/opt/cosmofy/livia/releases/${DEPLOY_SHA}"
            sudo install -o root -g root -m 0644 "${REMOTE_RELEASE}/livia.jar" \
              "/opt/cosmofy/livia/releases/${DEPLOY_SHA}/livia.jar"
            sudo install -o root -g root -m 0644 "${REMOTE_RELEASE}/opentelemetry-javaagent.jar" \
              "/opt/cosmofy/livia/releases/${DEPLOY_SHA}/opentelemetry-javaagent.jar"

            sudo install -d -o otelcol-contrib -g otelcol-contrib -m 0750 \
              /var/lib/otelcol-contrib/livia
            sudo install -d -o root -g root -m 0755 /etc/cosmofy /etc/otelcol-contrib
            sudo test -s /etc/cosmofy/livia-otel.env
            credential_count=$(sudo awk -F= \
              '/^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)=/ { count++ } END { print count+0 }' \
              /etc/cosmofy/livia-otel.env)
            test "${credential_count}" -eq 2
            sudo chown root:otelcol-contrib /etc/cosmofy/livia-otel.env
            sudo chmod 0640 /etc/cosmofy/livia-otel.env
            sudo install -o root -g otelcol-contrib -m 0640 \
              "${REMOTE_RELEASE}/otel-collector.yaml" /etc/otelcol-contrib/livia.yaml

            previous_release=$(readlink -f /opt/cosmofy/livia/current 2>/dev/null || true)
            had_previous_unit=false
            if sudo test -f /etc/systemd/system/livia.service; then
              sudo cp /etc/systemd/system/livia.service "${REMOTE_RELEASE}/livia.service.previous"
              had_previous_unit=true
            fi
            deployment_succeeded=false
            rollback() {
              if [ "${deployment_succeeded}" != true ]; then
                echo "Deployment did not complete; restoring the previous Livia runtime"
                if [ -n "${previous_release}" ] && [ -d "${previous_release}" ]; then
                  sudo ln -sfn "${previous_release}" /opt/cosmofy/livia/current
                else
                  sudo rm -f /opt/cosmofy/livia/current
                fi
                if [ "${had_previous_unit}" = true ]; then
                  sudo install -o root -g root -m 0644 \
                    "${REMOTE_RELEASE}/livia.service.previous" \
                    /etc/systemd/system/livia.service
                fi
                sudo systemctl daemon-reload
                sudo systemctl restart livia.service || true
              fi
              sudo rm -rf "${REMOTE_RELEASE}"
            }
            trap rollback EXIT

            sudo install -o root -g root -m 0644 \
              "${REMOTE_RELEASE}/cosmofy-livia-otel.service" \
              /etc/systemd/system/cosmofy-livia-otel.service
            sudo install -o root -g root -m 0644 \
              "${REMOTE_RELEASE}/livia.service" /etc/systemd/system/livia.service

            sudo -u otelcol-contrib bash -c \
              'set -a; . /etc/cosmofy/livia-otel.env; set +a; exec /usr/bin/otelcol-contrib validate --config=/etc/otelcol-contrib/livia.yaml'

            sudo ln -sfn "/opt/cosmofy/livia/releases/${DEPLOY_SHA}" /opt/cosmofy/livia/current
            sudo systemctl daemon-reload
            sudo systemctl enable cosmofy-livia-otel.service
            sudo systemctl restart cosmofy-livia-otel.service
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:13136/ >/dev/null; then
                break
              fi
              sleep 1
            done
            curl --fail --silent --max-time 5 http://127.0.0.1:13136/ >/dev/null
            sudo systemctl restart livia.service

            healthy=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:2259/health > /dev/null; then
                healthy=true
                break
              fi
              sleep 1
            done

            if [ "${healthy}" != true ]; then
              echo "Deploy failed: Livia health check did not recover"
              journalctl -u livia.service -n 100 --no-pager
              exit 1
            fi

            existing_response=$(curl --fail --silent --show-error --max-time 30 \
              -H 'Content-Type: application/json' \
              --data '{"query":"query ExistingApiSmoke { server time planets { name } articles { id title } universe { name } }"}' \
              http://127.0.0.1:2259/graphql)
            if echo "${existing_response}" | grep -q '"errors"'; then
              echo "Deploy failed: an existing GraphQL operation regressed"
              journalctl -u livia.service -n 100 --no-pager
              exit 1
            fi

            apod_response=$(curl --fail --silent --show-error --max-time 45 \
              -H 'Content-Type: application/json' \
              --data '{"query":"query DeploymentApod { apod { date title mediaType url hdUrl } }"}' \
              http://127.0.0.1:2259/graphql)
            if echo "${apod_response}" | grep -q '"errors"'; then
              echo "Deploy failed: APOD acceptance query returned GraphQL errors"
              journalctl -u livia.service -n 100 --no-pager
              exit 1
            fi
            echo "${apod_response}" | grep -q '"date"'

            news_response=$(curl --fail --silent --show-error --max-time 25 \
              -H 'Content-Type: application/json' \
              --data '{"query":"query LatestNews($limit:Int!,$offset:Int!,$ordering:NewsOrdering!){news(limit:$limit,offset:$offset,ordering:$ordering){totalCount articles{id title summary url imageUrl newsSite publishedAt}}}","variables":{"limit":24,"offset":0,"ordering":"PUBLISHED_AT_DESCENDING"}}' \
              http://127.0.0.1:2259/graphql)
            if echo "${news_response}" | grep -q '"errors"'; then
              echo "Deploy failed: News acceptance query returned GraphQL errors"
              journalctl -u livia.service -n 100 --no-pager
              exit 1
            fi
            echo "${news_response}" | grep -q '"totalCount"'

            articles_response=$(curl --fail --silent --show-error --max-time 25 \
              -H 'Content-Type: application/json' \
              --data '{"query":"query DeploymentArticles { articles { id title } }"}' \
              http://127.0.0.1:2259/graphql)
            if echo "${articles_response}" | grep -q '"errors"'; then
              echo "Deploy failed: Articles acceptance query returned GraphQL errors"
              journalctl -u livia.service -n 100 --no-pager
              exit 1
            fi
            article_count=$(echo "${articles_response}" | python3 -c \
              'import json,sys; print(len(json.load(sys.stdin)["data"]["articles"]))')
            if [ "${article_count}" -lt 1 ]; then
              echo "Deploy failed: Articles acceptance query returned an empty catalog"
              exit 1
            fi

            article_schema_response=$(curl --fail --silent --show-error --max-time 25 \
              -H 'Content-Type: application/json' \
              --data '{"query":"query ArticleSchema { __type(name: \"Query\") { fields { name } } }"}' \
              http://127.0.0.1:2259/graphql)
            echo "${article_schema_response}" | python3 -c \
              'import json,sys; fields={field["name"] for field in json.load(sys.stdin)["data"]["__type"]["fields"]}; assert "articles" in fields and "article" not in fields and "articlesPage" not in fields'
            echo "Deploy successful"
            deployment_succeeded=true
            trap - EXIT
            sudo rm -rf "${REMOTE_RELEASE}"
          EOF
